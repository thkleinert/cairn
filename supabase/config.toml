# Per-function deploy configuration — the CLI reads this on
# `supabase functions deploy`, so the JWT settings below can't be forgotten
# on the command line.

# Anonymous by design: callers authenticate with the trip's share token
# (validated inside the function), not a Supabase session.
[functions.trip-geojson]
verify_jwt = false

# verify_jwt checks the JWT's signature only, and the public anon key is a
# valid JWT — so what actually gates this is storage RLS, which the upload
# hits under the caller's own JWT.
[functions.persist-photo]
verify_jwt = true

# As above: verify_jwt is not the gate. The trip-owner check in
# create_trip_invite is, running under the caller's JWT.
[functions.invite-collaborator]
verify_jwt = true

# As above, with no RLS or RPC behind it to be the real gate — so this one
# resolves the caller itself and refuses anyone who isn't a signed-in user.
[functions.resolve-maps-url]
verify_jwt = true
