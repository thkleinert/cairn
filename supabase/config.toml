# Per-function deploy configuration — the CLI reads this on
# `supabase functions deploy`, so the JWT settings below can't be forgotten
# on the command line.

# Anonymous by design: callers authenticate with the trip's share token
# (validated inside the function), not a Supabase session.
[functions.trip-geojson]
verify_jwt = false

# Signed-in users only; the upload itself additionally runs under the
# caller's JWT so storage RLS applies.
[functions.persist-photo]
verify_jwt = true

# Signed-in users only; the trip-owner check is enforced by create_trip_invite
# running under the caller's JWT.
[functions.invite-collaborator]
verify_jwt = true

# Signed-in users only — but note that this setting alone does not achieve
# that: it verifies the JWT's signature, and the public anon key is a valid
# JWT. The function resolves the caller itself and refuses anyone who isn't a
# real user, because unlike its siblings it has no RLS or RPC behind it to do
# that job.
[functions.resolve-maps-url]
verify_jwt = true
