<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9488" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1d21" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TripMap" />
    <meta name="description" content="Plan and share your trips with an interactive map" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>TripMap</title>
    <script>
      // Measured on a real device: in an iOS standalone PWA, window.innerHeight
      // silently excludes the top safe-area inset (status bar) — 844 (real
      // screen) - 797 (innerHeight) = 47, exactly this device's inset-top —
      // even though fixed-position content still correctly extends up there.
      // That 47px gap is the bug. screen.height is the true physical height
      // and isn't short by that amount, so use it in standalone mode; a
      // regular browser tab still uses innerHeight, correctly respecting
      // Safari's own chrome. Runs before the splash paints so there's no
      // flash of the wrong size.
      (function () {
        function isStandalone() {
          return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        }
        function setAppHeight() {
          const height = isStandalone() ? window.screen.height : window.innerHeight;
          document.documentElement.style.setProperty('--app-height', height + 'px');
        }
        setAppHeight();
        window.addEventListener('resize', setAppHeight);
        window.addEventListener('orientationchange', function () { setTimeout(setAppHeight, 100); });
      })();
    </script>
    <style>
      #splash {
        position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
        height: var(--app-height, 100dvh);
        background: #ffffff;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 20px;
        transition: opacity 0.35s ease;
      }
      #splash.fade { opacity: 0; pointer-events: none; }
      #splash-name {
        color: #131416; font-size: 28px; font-weight: 700; margin: 0;
        font-family: -apple-system, system-ui, sans-serif; letter-spacing: -0.5px;
      }
      #splash-pin { fill: #0d9488; }
      #splash-pin-hole { fill: #ffffff; }
      @media (prefers-color-scheme: dark) {
        #splash { background: #0e0f10; }
        #splash-name { color: #f2f3f4; }
        #splash-pin { fill: #14b8a6; }
        #splash-pin-hole { fill: #0e0f10; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="76" height="76">
        <path id="splash-pin" d="M40 8C26.2 8 15 19.2 15 33c0 18.8 25 42 25 42s25-23.2 25-42C65 19.2 53.8 8 40 8z"/>
        <circle id="splash-pin-hole" cx="40" cy="33" r="12.5"/>
      </svg>
      <p id="splash-name">TripMap</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
