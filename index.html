<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9488" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1d21" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TripMap" />
    <meta name="description" content="Plan and share your trips with an interactive map" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>TripMap</title>
    <script>
      // iOS standalone PWAs can report a viewport shorter than the real
      // screen via CSS units alone (100dvh, height:100%) — reserving space
      // as if for browser chrome that doesn't exist in standalone mode.
      // window.innerHeight doesn't have this bug, so measure it in JS and
      // use that as the source of truth instead. Runs before the splash
      // paints so there's no flash of the wrong size.
      (function () {
        function setAppHeight() {
          document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
        }
        setAppHeight();
        window.addEventListener('resize', setAppHeight);
        window.addEventListener('orientationchange', function () { setTimeout(setAppHeight, 100); });
      })();
    </script>
    <style>
      #splash {
        position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
        height: var(--app-height, 100dvh);
        background: #ffffff;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 20px;
        transition: opacity 0.35s ease;
      }
      #splash.fade { opacity: 0; pointer-events: none; }
      #splash-name {
        color: #131416; font-size: 28px; font-weight: 700; margin: 0;
        font-family: -apple-system, system-ui, sans-serif; letter-spacing: -0.5px;
      }
      #splash-pin { fill: #0d9488; }
      #splash-pin-hole { fill: #ffffff; }
      @media (prefers-color-scheme: dark) {
        #splash { background: #0e0f10; }
        #splash-name { color: #f2f3f4; }
        #splash-pin { fill: #14b8a6; }
        #splash-pin-hole { fill: #0e0f10; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="76" height="76">
        <path id="splash-pin" d="M40 8C26.2 8 15 19.2 15 33c0 18.8 25 42 25 42s25-23.2 25-42C65 19.2 53.8 8 40 8z"/>
        <circle id="splash-pin-hole" cx="40" cy="33" r="12.5"/>
      </svg>
      <p id="splash-name">TripMap</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
