<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d9488" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1d21" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cairn" />
    <meta name="description" content="Plan and share your trips with an interactive map" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Cairn</title>
    <!-- Viewport-height custom properties (--app-height / --visual-height).
         External file, not inline, so the CSP needs no inline-script
         exception; still loads synchronously before the splash paints. -->
    <script src="/viewport.js"></script>
    <style>
      #splash {
        position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
        height: var(--app-height, 100dvh);
        background: #ffffff;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 20px;
        transition: opacity 0.35s ease;
      }
      #splash.fade { opacity: 0; pointer-events: none; }
      #splash-name {
        color: #131416; font-size: 28px; font-weight: 700; margin: 0;
        font-family: -apple-system, system-ui, sans-serif; letter-spacing: -0.5px;
      }
      #splash-pin { fill: #0d9488; }
      @media (prefers-color-scheme: dark) {
        #splash { background: #0e0f10; }
        #splash-name { color: #f2f3f4; }
        #splash-pin { fill: #14b8a6; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="76" height="76">
        <g id="splash-pin">
          <ellipse cx="40" cy="60" rx="27.5" ry="10.5" transform="rotate(-3 40 60)"/>
          <ellipse cx="38.75" cy="43.75" rx="20" ry="8.25" transform="rotate(5 38.75 43.75)"/>
          <ellipse cx="41.25" cy="30" rx="13.75" ry="6.25" transform="rotate(-6 41.25 30)"/>
          <ellipse cx="40" cy="20" rx="7.5" ry="4.25" transform="rotate(4 40 20)"/>
        </g>
      </svg>
      <p id="splash-name">Cairn</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
