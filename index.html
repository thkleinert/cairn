<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5b5ef4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TripMap" />
    <meta name="description" content="Plan and share your trips with an interactive map" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>TripMap</title>
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: linear-gradient(140deg, #7c7ef7 0%, #4347d4 100%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 20px;
        transition: opacity 0.35s ease;
      }
      #splash.fade { opacity: 0; pointer-events: none; }
      #splash-name {
        color: #fff; font-size: 28px; font-weight: 700; margin: 0;
        font-family: -apple-system, 'Inter', sans-serif; letter-spacing: -0.5px;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="76" height="76">
        <path d="M40 8C26.2 8 15 19.2 15 33c0 18.8 25 42 25 42s25-23.2 25-42C65 19.2 53.8 8 40 8z" fill="white"/>
        <circle cx="40" cy="33" r="12.5" fill="#5b5ef4"/>
      </svg>
      <p id="splash-name">TripMap</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
